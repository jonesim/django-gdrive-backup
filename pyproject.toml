[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cloud-backup"
version = "0.1.0"
description = "Backs up django postgres databases, local folders and S3 folders to Google Drive, S3-compatible storage (AWS, Backblaze B2, Cloudflare R2) or Azure Blob Storage."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ian Jones" },
]
dependencies = [
    "encrypted-credentials",
    "google-client-helper",
    "requests",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
s3 = ["boto3"]
azure = ["azure-storage-blob"]
encryption = ["cryptography"]

[project.urls]
Homepage = "https://github.com/jonesim/django-cloud-backup"

[tool.setuptools.packages.find]
include = ["cloud_backup", "cloud_backup.*"]

[tool.setuptools]
include-package-data = true
